[project]
name = "business-analyser-agentic-workflow"
version = "0.1.0"
description = "Agentic backend for the Business Analyser trade-data assistant (FastAPI + LangGraph)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Rishabh Jain" }]
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# We use Black for formatting; keep Ruff's formatter disabled to avoid
# two tools fighting over the same job. `ruff check` is lint-only here.

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: pure-function/no-I/O tests, run on every push",
    "integration: tests against recorded fixtures or the FastAPI app, no live external calls",
    "llm: cassette-based tests exercising LLM-provider-shaped code paths; MockLLM by default, no live model call in CI",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
# Finding M14 (Phase 4 review, ARCH-08): "unit tests with a coverage floor"
# is an explicit master-brief §Phase 2 CI requirement that was never wired
# up — its absence is the concrete, direct reason the fully-dead
# app/cache/response_cache.py (finding B8) shipped unnoticed at 0% coverage
# for an entire review cycle. 90% is set a few points below the real,
# measured figure at the time this was added (95%) - enough to fail loudly
# on a genuinely large uncovered addition (exactly B8's shape) without being
# so tight it breaks on every small, legitimately-hard-to-cover line.
fail_under = 90
