name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required Settings fields (app/settings.py) that would otherwise make the
  # process fail loudly at import time. tests/conftest.py already sets safe
  # placeholders for the pytest jobs; these cover any other job that
  # happens to import app.* (mypy does not execute code, so it needs none
  # of this).
  COMTRADE_API_KEY: ci-placeholder-comtrade-key
  GEMINI_API_KEY: ci-placeholder-gemini-key
  LLM_PROVIDER: mock

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .

  format-check:
    name: format-check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run black --check .

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run mypy app

  test:
    name: unit + integration (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -m "unit or integration" --cov=app --cov-report=term-missing --cov-fail-under=90

  llm:
    name: llm (pytest, cassette-replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      # No live model call: LLM_PROVIDER=mock (env, above), and the llm-marked
      # tests themselves replay synthetic cassettes (tests/llm/cassettes/)
      # rather than calling a real model — see tests/llm/cassette.py.
      - run: uv run pytest -m llm

  eval-gate:
    name: eval-gate (number-grounding, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      # No live model call: LLM_PROVIDER=mock (env, above). Blocks merge
      # specifically on a number-grounding regression (docs/PLAN.md §7's
      # table); see evals/run_evals.py's module docstring for exactly what
      # is and isn't scored here, and why.
      - run: uv run python evals/run_evals.py

  dep-audit:
    name: dep-audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pip-audit

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t business-analyser-agentic-workflow:ci .
